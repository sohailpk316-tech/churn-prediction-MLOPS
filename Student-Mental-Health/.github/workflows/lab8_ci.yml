name: Lab 8 CI
on:
  push:
  pull_request:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pandas scikit-learn numpy joblib mlflow matplotlib
      - run: python -m compileall -q src pipelines
      - run: python src/mlops_pipeline/01_load_data.py
      - run: python src/mlops_pipeline/02_validate_data.py
