apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-mental-health-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-mental-health-api
  template:
    metadata:
      labels:
        app: student-mental-health-api
    spec:
      containers:
        - name: student-mental-health-api
          image: student-mental-health-api:lab11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
